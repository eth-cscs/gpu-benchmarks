include:
  - local: '.gitlab/includes/common_pipeline.yml'

stages:
  - build
  - test

variables:
  UENV_IMAGE: "prgenv-gnu/25.6:v2"
  WITH_UENV_VIEW: "default"
  SLURM_PARTITION: "normal"


build_benchmarks_gh200:
  extends:
    - .uenv-runner-daint-gh200
    - .cmake_common
    - .build_common
  stage: build
  image: $UENV_IMAGE
  script:
    - cmake --version
    - nvcc --version || echo "CUDA not found in PATH"

    - rm -rf build
    - cmake -Bbuild $CMAKE_COMMON_FLAGS
        -DWITH_HIP=OFF
        -DWITH_CUDA=ON
    - echo "CUDA Architectures configured:"
    - grep -r "CMAKE_CUDA_ARCHITECTURES" build/CMakeCache.txt || echo "Not found in cache"
    - cmake --build build --verbose

  artifacts:
    paths:
      - build/
    expire_in: 1 hour


test_benchmarks_gh200:
  needs: [build_benchmarks_gh200]
  extends:
    - .uenv-runner-daint-gh200
    - .test_common
  stage: test
  image: $UENV_IMAGE
  script:
    - ctest --test-dir build --output-on-failure
